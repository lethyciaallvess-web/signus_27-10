services:
  # Banco de dados
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?defina no .env}"
      MYSQL_DATABASE: signus
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/BANCO-DE-DADOS-21-10.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rede-interna

  backend:
    build: ./backend
    container_name: backend_node
    restart: always
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      DB_DATABASE: signus
      JWT_SECRET: "${JWT_SECRET:?defina no .env}"
    depends_on:
      - db
    networks:
      - rede-interna
      - rede-externa

  frontend:
    build: ./frontend
    container_name: frontend_react
    restart: always
    networks:
      - rede-externa

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rede-interna
      - rede-externa

volumes:
  db_data:

networks:
  rede-interna:
  rede-externa: